<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫码取号</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Zpix';src:url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font/dist/Zpix.ttf') format('truetype');font-display:swap}
:root{
  --bg:#1a0f2e;
  --bg-panel:#2a1b4a;
  --bg-deep:#120a24;
  --bg-input:#1f1338;
  --text:#fff8e7;
  --text-mute:#a89bc9;
  --text-dim:#6b5d8f;
  --accent:#ff006e;
  --accent-2:#fb5607;
  --maimai:#00f5ff;
  --chunithm:#ff006e;
  --vip:#ffbe0b;
  --green:#06ffa5;
  --danger:#ff3864;
  --pixel-border:#000;
  --font-pixel:"Press Start 2P",monospace;
  --font-vt:"VT323",monospace;
  --font-pixel-cn:"Zpix","Press Start 2P",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-vt);min-height:100vh;font-size:18px;line-height:1.4;-webkit-font-smoothing:none;image-rendering:pixelated}
body{display:flex;flex-direction:column;align-items:center;padding:20px;position:relative}

/* 像素网格背景 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:16px 16px}
/* CRT 扫描线 */
body::after{content:"";position:fixed;inset:0;z-index:100;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.15) 0px,rgba(0,0,0,0.15) 2px,transparent 2px,transparent 4px);opacity:0.4}

.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;flex:1;position:relative;z-index:2}
header{text-align:center;padding:16px 0 8px}
header .shop{font-family:var(--font-pixel-cn);font-size:24px;color:var(--text);letter-spacing:0.02em;line-height:1.3;text-shadow:3px 3px 0 var(--pixel-border)}
header .tag{font-family:var(--font-vt);font-size:16px;color:var(--maimai);margin-top:8px;letter-spacing:0.05em;text-shadow:2px 2px 0 var(--pixel-border)}

.card{background:var(--bg-panel);padding:24px 20px;box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--bg-panel),0 0 0 9px var(--pixel-border),6px 6px 0 0 rgba(0,0,0,0.5)}
.section-title{font-family:var(--font-pixel);font-size:13px;margin:0 0 18px;text-align:center;color:var(--green);letter-spacing:0.05em;text-shadow:2px 2px 0 var(--pixel-border)}

.machine-pick{display:grid;gap:12px;margin-bottom:18px}
.machine-pick.cols-1{grid-template-columns:1fr}
.machine-pick.cols-2{grid-template-columns:1fr 1fr}
.machine-pick.cols-multi{grid-template-columns:1fr 1fr}
.machine-pick button{background:var(--bg-input);border:none;color:var(--text);padding:18px 10px;font-size:14px;font-family:var(--font-pixel-cn);cursor:pointer;transition:all 0.1s steps(2);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--bg-input),0 0 0 9px var(--pixel-border),4px 4px 0 0 rgba(0,0,0,0.5)}
.machine-pick button .ico{position:relative;font-size:0;color:inherit;line-height:1}
.machine-pick button .ico::after{content:"[▶]";font-family:var(--font-pixel);font-size:11px;color:inherit;font-weight:500;letter-spacing:0}
.machine-pick button .ml{font-family:var(--font-pixel-cn);font-size:14px;letter-spacing:0.01em}
.machine-pick button.sel{color:var(--maimai);background:rgba(0,245,255,0.12);box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--maimai),0 0 0 9px var(--pixel-border),0 0 12px rgba(0,245,255,0.4),4px 4px 0 0 rgba(0,0,0,0.5)}
.machine-pick button.repair{opacity:0.4}
.machine-pick button .repair-flag{display:none}
.machine-pick button.repair .repair-flag{display:block;position:absolute;top:6px;right:6px;font-family:var(--font-pixel);font-size:9px;background:transparent;color:var(--danger);padding:3px 6px;letter-spacing:0.04em;box-shadow:0 0 0 2px var(--danger)}
.machine-pick button:not(.repair):active{transform:translate(2px,2px);box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--bg-input),0 0 0 9px var(--pixel-border),2px 2px 0 0 rgba(0,0,0,0.5)}

.btn-take{width:100%;padding:20px;border:none;font-size:16px;font-family:var(--font-pixel);cursor:pointer;color:var(--text);background:var(--accent);letter-spacing:0.05em;transition:all 0.1s steps(2);box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--accent),0 0 0 9px var(--pixel-border),6px 6px 0 0 rgba(0,0,0,0.5)}
.btn-take:active{transform:translate(4px,4px);box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--accent),0 0 0 9px var(--pixel-border),2px 2px 0 0 rgba(0,0,0,0.5)}
.btn-take:disabled{opacity:0.4;cursor:not-allowed}

.flash-ahead{animation:flashAhead 0.8s steps(4) end}
@keyframes flashAhead{0%{color:var(--maimai);transform:scale(1.3)}100%{color:inherit;transform:scale(1)}}

.result{text-align:center;display:none}
.result.show{display:block}
.result .lbl{font-family:var(--font-pixel);font-size:11px;color:var(--text-dim);letter-spacing:0.08em;text-shadow:2px 2px 0 var(--pixel-border)}
.result .num{font-family:var(--font-pixel);font-size:64px;line-height:1;margin:14px 0;letter-spacing:0.02em;color:var(--text);text-shadow:4px 4px 0 var(--pixel-border),8px 8px 0 var(--accent-2),0 0 20px rgba(255,0,110,0.4)}
.result .num.member{color:var(--vip);text-shadow:4px 4px 0 var(--pixel-border),8px 8px 0 var(--accent-2),0 0 20px rgba(255,190,11,0.6)}
.result .num.vip-num{color:var(--vip);text-shadow:4px 4px 0 var(--pixel-border),8px 8px 0 var(--chunithm),0 0 30px var(--vip),0 0 60px rgba(255,190,11,0.4);animation:vipPulse 0.8s steps(2) infinite}
.result .name-display{font-family:var(--font-pixel-cn);font-size:18px;color:var(--text);margin-top:8px;letter-spacing:0.01em;text-shadow:2px 2px 0 var(--pixel-border)}
.result .member-badge{display:inline-block;background:transparent;color:var(--vip);font-family:var(--font-pixel);font-size:10px;padding:5px 10px;margin-top:8px;letter-spacing:0.04em;box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--vip)}
.result .vip-badge{display:inline-block;background:transparent;color:var(--vip);font-family:var(--font-pixel);font-size:11px;padding:6px 12px;margin-top:8px;letter-spacing:0.04em;box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--vip),0 0 0 6px var(--pixel-border),0 0 12px var(--vip);animation:blink 0.6s steps(2) infinite}
@keyframes vipBlink{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.3}}
@keyframes vipPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.result .meta{margin-top:22px;display:flex;gap:12px;justify-content:center}
.result .meta .box{background:var(--bg-input);padding:14px 18px;min-width:96px;box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--bg-input),0 0 0 9px var(--pixel-border),4px 4px 0 0 rgba(0,0,0,0.5)}
.result .meta .box .v{font-family:var(--font-pixel);font-size:22px;color:var(--text);line-height:1.1;text-shadow:2px 2px 0 var(--pixel-border)}
.result .meta .box .k{font-family:var(--font-pixel-cn);font-size:11px;color:var(--text-dim);margin-top:6px;letter-spacing:0.04em}

.status-line{font-family:var(--font-pixel-cn);font-size:15px;text-align:center;padding:12px 14px;margin-top:14px;border-left:6px solid;box-shadow:0 0 0 3px var(--pixel-border)}
.status-line.wait{background:var(--bg-deep);color:var(--maimai);border-left-color:var(--maimai)}
.status-line.called{background:var(--bg-deep);color:var(--vip);border-left-color:var(--vip);font-size:16px;animation:blink 1s steps(2) infinite}

.tip{font-family:var(--font-pixel-cn);font-size:13px;color:var(--text-dim);text-align:center;line-height:1.6;padding:0 8px}
.retake{margin-top:14px;width:100%;padding:14px;background:transparent;color:var(--text-mute);font-family:var(--font-pixel-cn);font-size:13px;cursor:pointer;transition:all 0.1s steps(2);box-shadow:0 0 0 2px var(--text-dim),0 0 0 4px var(--bg-panel),0 0 0 6px var(--text-dim)}
.retake:active{transform:translate(2px,2px);color:var(--maimai);box-shadow:0 0 0 2px var(--maimai),0 0 0 4px var(--bg-panel),0 0 0 6px var(--maimai)}

footer{margin-top:auto;padding:12px 0;font-family:var(--font-pixel);font-size:10px;color:var(--text-dim);text-align:center;letter-spacing:0.08em}

.saved-badge{display:inline-block;background:transparent;color:var(--green);font-family:var(--font-pixel);font-size:9px;padding:4px 10px;margin-top:8px;letter-spacing:0.04em;box-shadow:0 0 0 2px var(--green);animation:blink 1.5s steps(2) infinite}

.phone-field{margin-bottom:16px}
.phone-field label{display:block;font-family:var(--font-pixel);font-size:10px;color:var(--text-mute);margin-bottom:8px;letter-spacing:0.04em;text-shadow:2px 2px 0 var(--pixel-border)}
.phone-row{display:flex;gap:8px;align-items:center}
.phone-row input{flex:1;background:var(--bg-input);border:none;color:var(--text);padding:14px 14px;font-size:18px;font-family:var(--font-vt);outline:none;transition:all 0.1s steps(2);box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--bg-input),0 0 0 6px var(--pixel-border)}
.phone-row input:focus{box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--bg-input),0 0 0 6px var(--maimai),0 0 8px var(--maimai)}
.phone-row input::placeholder{color:var(--text-dim)}
.phone-row .member-tag{font-family:var(--font-pixel);font-size:9px;background:var(--vip);color:var(--bg-deep);padding:5px 8px;font-weight:600;white-space:nowrap;letter-spacing:0.04em;box-shadow:0 0 0 2px var(--pixel-border),0 0 8px var(--vip);animation:blink 1s steps(2) infinite}
.phone-hint{font-family:var(--font-pixel-cn);font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5}

.member-info-row{display:none;margin-top:12px;flex-direction:column;gap:8px}
.member-info-row.show{display:flex}
.member-info-row .visits-line{font-family:var(--font-pixel);font-size:11px;color:var(--vip);text-align:center;letter-spacing:0.02em;text-shadow:2px 2px 0 var(--pixel-border)}
.member-info-row .visits-line.vip{font-size:12px;color:var(--vip);text-shadow:0 0 10px rgba(255,190,11,0.6),2px 2px 0 var(--pixel-border);animation:blink 0.8s steps(2) infinite}
.member-name-field{display:flex;flex-direction:column;gap:6px}
.member-name-field label{font-family:var(--font-pixel);font-size:10px;color:var(--text-mute);letter-spacing:0.04em}
.member-name-field input{background:var(--bg-input);border:none;color:var(--text);padding:12px 14px;font-size:18px;font-family:var(--font-vt);outline:none;transition:all 0.1s steps(2);box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--bg-input),0 0 0 6px var(--pixel-border)}
.member-name-field input:focus{box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--bg-input),0 0 0 6px var(--maimai),0 0 8px var(--maimai)}
.member-name-field input::placeholder{color:var(--text-dim)}

.avatar-row{display:none;margin-top:10px;align-items:center;gap:10px}
.avatar-row.show{display:flex}
.avatar-row .av-preview{width:48px;height:48px;background:var(--bg-input);border:3px solid var(--vip);background-size:cover;background-position:center;flex-shrink:0;image-rendering:pixelated;box-shadow:0 0 0 3px var(--pixel-border),0 0 8px var(--vip)}
.avatar-row .av-btn{font-family:var(--font-pixel);font-size:9px;background:var(--bg-deep);color:var(--text-mute);padding:7px 10px;font-weight:600;cursor:pointer;letter-spacing:0.04em;transition:all 0.1s steps(2);box-shadow:0 0 0 2px var(--pixel-border),0 0 0 4px var(--bg-deep),0 0 0 6px var(--pixel-border)}
.avatar-row .av-btn:active{transform:translate(2px,2px);color:var(--maimai)}
.avatar-row .av-tip{font-family:var(--font-pixel-cn);font-size:12px;color:var(--text-dim);flex:1}

#call-notify{position:fixed;top:14px;left:14px;z-index:50;background:var(--bg-panel);padding:14px 16px;display:none;align-items:center;gap:12px;max-width:90vw;box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--vip),0 0 0 9px var(--pixel-border),6px 6px 0 0 rgba(0,0,0,0.5)}
#call-notify.show{display:flex;animation:callPulse 0.4s steps(4) end}
#call-notify.vip{box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--danger),0 0 0 9px var(--pixel-border),0 0 12px var(--danger),6px 6px 0 0 rgba(0,0,0,0.5)}
#call-notify .cn-avatar{width:52px;height:52px;background-size:cover;background-position:center;border:3px solid var(--vip);flex-shrink:0;background-color:var(--bg-input);image-rendering:pixelated;box-shadow:0 0 0 3px var(--pixel-border)}
#call-notify .cn-avatar.empty{display:flex;align-items:center;justify-content:center;font-size:22px}
#call-notify .cn-info{display:flex;flex-direction:column;gap:2px}
#call-notify .cn-title{font-family:var(--font-pixel);font-size:9px;color:var(--vip);letter-spacing:0.08em;text-shadow:2px 2px 0 var(--pixel-border);animation:blink 1s steps(2) infinite}
#call-notify .cn-num{font-family:var(--font-pixel);font-size:24px;color:var(--vip);font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-0.01em;text-shadow:3px 3px 0 var(--pixel-border),0 0 10px rgba(255,190,11,0.4)}
#call-notify .cn-name{font-family:var(--font-pixel-cn);font-size:18px;color:var(--vip);letter-spacing:-0.01em;text-shadow:2px 2px 0 var(--pixel-border)}
#call-notify .cn-sub{font-family:var(--font-pixel-cn);font-size:12px;color:var(--text-mute)}
@keyframes callPulse{0%{transform:scale(0.95);opacity:0}50%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}

.forum-entry{display:flex;align-items:center;gap:12px;background:var(--bg-panel);padding:14px 16px;text-decoration:none;color:var(--text);transition:all 0.1s steps(2);position:relative;overflow:hidden;box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--bg-panel),0 0 0 9px var(--pixel-border),4px 4px 0 0 rgba(0,0,0,0.5)}
.forum-entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);box-shadow:0 0 0 2px var(--pixel-border)}
.forum-entry:active{transform:translate(2px,2px);box-shadow:0 0 0 3px var(--pixel-border),0 0 0 6px var(--accent),0 0 0 9px var(--pixel-border),2px 2px 0 0 rgba(0,0,0,0.5)}
.forum-entry .fe-icon{font-size:18px;width:36px;height:36px;background:var(--bg-input);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 2px var(--pixel-border)}
.forum-entry .fe-text{flex:1;min-width:0}
.forum-entry .fe-title{font-family:var(--font-pixel-cn);font-size:14px;color:var(--text);line-height:1.3;letter-spacing:0.01em;text-shadow:1px 1px 0 var(--pixel-border)}
.forum-entry .fe-sub{font-family:var(--font-vt);font-size:14px;color:var(--text-mute);margin-top:2px}
.forum-entry .fe-arrow{font-family:var(--font-pixel);font-size:16px;color:var(--maimai);flex-shrink:0;font-weight:400;text-shadow:2px 2px 0 var(--pixel-border)}
</style>
</head>
<body>
<div id="call-notify"><div class="cn-avatar empty" id="cn-avatar">👤</div><div class="cn-info"><div class="cn-title" id="cn-title">到号了</div><div class="cn-num" id="cn-num">—</div><div class="cn-name" id="cn-name" style="display:none;"></div><div class="cn-sub" id="cn-sub">请前往机台</div></div></div>
<div class="wrap">
<header>
<div class="shop" id="shop-name">你的店名</div>
<div class="tag" id="shop-tag">扫码取号 · 排队中请留意叫号</div>
</header>
<div id="pick-card" class="card">
<h2 class="section-title">选择机台取号</h2>
<div class="phone-field">
<label>会员手机号（可选）</label>
<div class="phone-row">
<input type="tel" id="in-phone" placeholder="输入手机号登录会员" maxlength="11" inputmode="numeric">
<span class="member-tag" id="member-tag" style="display:none;">会员</span>
</div>
<div class="phone-hint" id="phone-hint">如果是会员，输入手机号后取号可享金色号码标识。非会员可直接取号。</div>
<div class="member-info-row" id="member-info-row">
<div class="visits-line" id="visits-line"></div>
<div class="member-name-field">
<label>自定义叫号名称（叫号时会念出名称）</label>
<input type="text" id="in-member-name" placeholder="如：小明" maxlength="20">
</div>
</div>
<div class="avatar-row" id="avatar-row">
<div class="av-preview" id="av-preview"></div>
<label class="av-btn" for="avatar-file-input">上传头像</label>
<input type="file" id="avatar-file-input" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
<span class="av-tip" id="av-tip">上传自定义头像，叫号时显示</span>
</div>
</div>
<div class="machine-pick cols-2" id="machine-pick"></div>
<button class="btn-take" id="btn-take">取号</button>
</div>
<div id="result-card" class="card result">
<div class="lbl">您的号码</div>
<div class="num" id="my-num">—</div>
<div id="my-name-display" class="name-display" style="display:none;"></div>
<div id="my-member-badge" class="member-badge" style="display:none;">⭐ 会员尊享</div>
<div id="my-vip-badge" class="vip-badge" style="display:none;">⭐⭐⭐ VIP 尊享 ⭐⭐⭐</div>
<div class="meta">
<div class="box"><div class="v" id="my-ahead">—</div><div class="k">前方人数</div></div>
<div class="box"><div class="v" id="my-est">—</div><div class="k">预计等待(分)</div></div>
</div>
<div class="status-line wait" id="my-status">排队中，请留意大屏叫号</div>
<div id="saved-info" style="display:none;text-align:center;margin-top:10px"><span class="saved-badge">号码已保存，再次扫码可查看</span></div>
<button class="retake" id="btn-retake" style="display:none">放弃此号，重新取号</button>
</div>
<a href="/forum.html" class="forum-entry" id="forum-entry">
<div class="fe-icon">💬</div>
<div class="fe-text">
<div class="fe-title">等号无聊？进社区聊聊</div>
<div class="fe-sub" id="fe-sub">约拼机 · 晒成绩 · 求带教学</div>
</div>
<div class="fe-arrow">→</div>
</a>
<div class="tip" id="tip">取号后号码会保存在本机，再次扫码可查看当前排队状态。</div>
<footer>排队大屏系统</footer>
</div>
<script>
(function(){"use strict";
var MACHINE="",myNumber=null,myMachine=null,evtSource=null,myIsMember=false,myAvatar=null,myName="",myVip=false,myVisits=0;
var STORE_KEY="pq_taken_number_v1";
function $(id){return document.getElementById(id)}
function apiPost(p,b){return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function findMachine(id,machines){machines=machines||[];for(var i=0;i<machines.length;i++){if(machines[i].id===id)return machines[i]}return null}
function labelOf(m,machines){var mc=findMachine(m,machines);return mc?mc.label:m}
function statusOf(m,machines){var mc=findMachine(m,machines);return(mc&&mc.status)||"ok"}
function escHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function saveNumber(machine,number,phone,isMember,avatar,name,vip,visits){try{localStorage.setItem(STORE_KEY,JSON.stringify({machine:machine,number:number,phone:phone||"",isMember:!!isMember,avatar:avatar||null,name:name||"",vip:!!vip,visits:visits||0,ts:Date.now()}))}catch(e){}}
function loadNumber(){try{var s=localStorage.getItem(STORE_KEY);if(!s)return null;var d=JSON.parse(s);if(d&&d.machine&&d.number)return d}catch(e){}return null}
function clearNumber(){try{localStorage.removeItem(STORE_KEY)}catch(e){}}
// 动态渲染机台按钮
function renderMachinePick(machines){
  var box=$("machine-pick");
  var sel=MACHINE;
  // 选第一个可用机台作为默认
  if(!sel||!findMachine(sel,machines)){
    var ok=null;
    for(var i=0;i<machines.length;i++){if(statusOf(machines[i].id,machines)!=="repair"){ok=machines[i].id;break}}
    MACHINE=ok||(machines.length?machines[0].id:"");
  }
  // 列数适配
  var n=machines.length;
  box.className="machine-pick "+(n<=1?"cols-1":(n===2?"cols-2":"cols-multi"));
  box.innerHTML="";
  machines.forEach(function(mc){
    var btn=document.createElement("button");
    var isRepair=statusOf(mc.id,machines)==="repair";
    var isSel=mc.id===MACHINE;
    btn.setAttribute("data-machine",mc.id);
    btn.className=(isSel?"sel":"")+(isRepair?" repair":"");
    btn.innerHTML='<span class="ico">🎮</span><span class="ml">'+escHtml(mc.label)+'</span><span class="repair-flag">维护中</span>';
    box.appendChild(btn);
  });
  box.querySelectorAll("button[data-machine]").forEach(function(b){
    b.addEventListener("click",function(){
      var id=b.getAttribute("data-machine");
      if(statusOf(id,machines)==="repair")return;
      MACHINE=id;
      renderMachinePick(machines);
    });
  });
}
$("btn-take").addEventListener("click",function(){
  var btn=$("btn-take");btn.disabled=true;btn.textContent="取号中...";
  var phone=String($("in-phone").value||"").trim();
  var name=myIsMember?String($("in-member-name").value||"").trim():"";
  if(!MACHINE){btn.disabled=false;btn.textContent="取号";$("tip").textContent="请先选择机台";return}
  apiPost("/api/take",{machine:MACHINE,phone:phone,name:name}).then(function(d){
    if(!d||!d.ok){btn.disabled=false;btn.textContent="取号";$("tip").textContent=(d&&d.error)||"取号失败，请重试";return}
    myNumber=d.number;myMachine=d.machine;myIsMember=!!d.isMember;myAvatar=d.avatar||null;myName=d.name||"";myVip=!!d.vip;myVisits=d.visits||0;
    saveNumber(d.machine,d.number,phone,!!d.isMember,d.avatar,myName,myVip,myVisits);
    showResult(d.machine,d.number,d.ahead,d.estMin,!!d.isMember,myName,myVip);
    requestNotifyPermission();
    connectSSE();
  }).catch(function(e){btn.disabled=false;btn.textContent="取号";$("tip").textContent="网络错误："+e.message});
});
// 手机号实时检测会员
var phoneCheckTimer=null;
$("in-phone").addEventListener("input",function(e){
  var phone=String(e.target.value||"").trim();
  clearTimeout(phoneCheckTimer);
  var tag=$("member-tag"),hint=$("phone-hint"),info=$("member-info-row");
  if(!phone||phone.length<11){
    tag.style.display="none";
    hint.textContent="如果是会员，输入手机号后取号可享金色号码标识。非会员可直接取号。";
    hint.style.color="var(--text-dim)";
    info.classList.remove("show");
    $("avatar-row").classList.remove("show");
    myAvatar=null;myIsMember=false;
    return;
  }
  phoneCheckTimer=setTimeout(function(){
    apiPost("/api/check-member",{phone:phone}).then(function(d){
      if(d&&d.isMember){
        tag.style.display="inline-block";
        hint.textContent="✓ 会员已识别，取号后号码将显示金色";
        hint.style.color="#FFD86B";
        myAvatar=d.avatar||null;
        myIsMember=true;
        myVip=!!d.vip;
        myVisits=d.visits||0;
        myName=d.name||"";
        // 显示次数与名称输入
        info.classList.add("show");
        var vl=$("visits-line");
        if(myVip){vl.className="visits-line vip";vl.textContent="⭐⭐⭐ VIP 尊享 · 累计 "+myVisits+" 次 ⭐⭐⭐"}
        else{vl.className="visits-line";vl.textContent="您是第 "+myVisits+" 次光临"}
        $("in-member-name").value=myName;
        // 头像
        $("avatar-row").classList.add("show");
        if(myAvatar){$("av-preview").style.backgroundImage="url('"+myAvatar+"')";$("av-tip").textContent="头像已设置，叫号时显示"}
        else{$("av-preview").style.backgroundImage="none";$("av-tip").textContent="上传自定义头像，叫号时显示"}
      }
      else{
        tag.style.display="none";
        hint.textContent="非会员用户，号码为普通白色。会员请联系前台办理。";
        hint.style.color="var(--text-dim)";
        info.classList.remove("show");
        $("avatar-row").classList.remove("show");
        myAvatar=null;myIsMember=false;
      }
    }).catch(function(){});
  },300);
});
// 显示结果页
function showResult(machine,number,ahead,estMin,isMember,name,vip){
  $("pick-card").style.display="none";
  $("result-card").classList.add("show");
  $("my-num").textContent=number;
  $("my-num").className="num "+(vip?"vip-num":(isMember?"member":""));
  // 显示会员名称
  if(isMember&&name){
    $("my-name-display").style.display="block";
    $("my-name-display").textContent=name;
  }else{
    $("my-name-display").style.display="none";
  }
  $("my-member-badge").style.display=(isMember&&!vip)?"inline-block":"none";
  $("my-vip-badge").style.display=vip?"inline-block":"none";
  $("my-ahead").textContent=ahead!=null?ahead:"—";
  $("my-est").textContent=estMin>0?estMin:"~";
  $("my-status").className="status-line wait";
  $("my-status").textContent="排队中，请留意大屏叫号";
  $("saved-info").style.display="block";
  $("btn-retake").style.display="block";
}
// 上传头像
function uploadAvatar(file){
  var phone=String($("in-phone").value||"").trim();
  if(!phone||!myIsMember){return}
  if(file.size>3*1024*1024){$("av-tip").textContent="图片过大（超过 3MB），请压缩后重试";return}
  var fd=new FormData();
  fd.append("file",file);
  fd.append("phone",phone);
  $("av-tip").textContent="上传中…";
  fetch("/api/upload-avatar",{method:"POST",body:fd}).then(function(r){return r.json()}).then(function(d){
    if(d&&d.ok){
      myAvatar=d.avatar;
      $("av-preview").style.backgroundImage="url('"+myAvatar+"')";
      $("av-tip").textContent="头像已设置，叫号时显示";
    }else{$("av-tip").textContent="上传失败："+((d&&d.error)||"未知错误")}
  }).catch(function(e){$("av-tip").textContent="上传失败："+e.message});
}
$("avatar-file-input").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(f){uploadAvatar(f);e.target.value=""}});
// 叫号通知（左上角，会员才弹）
function showCallNotify(number,machine,isMember,avatar,name,vip){
  if(!isMember){return}
  var box=$("call-notify");
  box.className=vip?"vip":"";
  box.classList.add("show");
  // 名称优先显示
  if(name){
    $("cn-num").style.display="none";
    $("cn-name").style.display="block";
    $("cn-name").textContent=name;
  }else{
    $("cn-num").style.display="block";
    $("cn-name").style.display="none";
    $("cn-num").textContent=number;
  }
  $("cn-title").textContent=vip?"⭐ VIP 到号了":"到号了";
  $("cn-sub").textContent="请前往 "+labelOf(machine,state.machines)+" 机台";
  var avEl=$("cn-avatar");
  if(avatar){avEl.style.backgroundImage="url('"+avatar+"')";avEl.classList.remove("empty");avEl.textContent=""}
  else{avEl.style.backgroundImage="none";avEl.classList.add("empty");avEl.textContent="👤"}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200,200,100,300])}catch(e){}
  // 浏器系统通知（离开页面也能收到）
  try{
    if("Notification" in window && Notification.permission==="granted"){
      var title=vip?"⭐ VIP 到号了！":"🎉 到号了！";
      var body=(name?name+" ":"")+"请前往 "+labelOf(machine,state.machines)+" 机台";
      var n=new Notification(title,{body:body,tag:"call-notify",requireInteraction:true});
      n.onclick=function(){window.focus();n.close()};
    }
  }catch(e){}
}
// 请求通知权限（取号时触发）
function requestNotifyPermission(){
  try{
    if("Notification" in window && Notification.permission==="default"){
      Notification.requestPermission().then(function(){});
    }
  }catch(e){}
}
function hideCallNotify(){$("call-notify").classList.remove("show")}
$("btn-retake").addEventListener("click",function(){
  if(!confirm("确定放弃当前号码吗？放弃后该号码将从大屏队列消失，需重新取号排队。"))return;
  var btn=$("btn-retake");btn.disabled=true;btn.textContent="放弃中...";
  apiPost("/api/cancel",{machine:myMachine,number:myNumber}).then(function(){
    clearNumber();
    if(evtSource){try{evtSource.close()}catch(e){}}
    myNumber=null;myMachine=null;
    $("result-card").classList.remove("show");
    $("pick-card").style.display="block";
    $("btn-take").disabled=false;$("btn-take").textContent="取号";
    $("tip").textContent="已放弃号码。取号后号码会保存在本机，再次扫码可查看当前排队状态。";
    btn.disabled=false;btn.textContent="放弃此号，重新取号";
  }).catch(function(e){
    btn.disabled=false;btn.textContent="放弃此号，重新取号";
    $("tip").textContent="网络错误，重试："+e.message;
  });
});
// 全局 state（用于动态机台渲染）
var state={machines:[]};
function refreshFromState(s){
  if(!s)return;
  state=s;
  if(s.shopName)$("shop-name").textContent=s.shopName;
  if(s.tagline)$("shop-tag").textContent=s.tagline;
  // 动态机台按钮
  if(s.machines&&s.machines.length){
    var pickVisible=$("pick-card").style.display!=="none";
    renderMachinePick(s.machines);
  }
  // 等待位置实时更新
  if(myNumber&&myMachine){
    var q=s.queues[myMachine]||[];
    var idx=q.indexOf(myNumber);
    var called=s.current[myMachine]===myNumber;
    if(called){
      $("my-status").className="status-line called";
      $("my-status").textContent="🎉 到号了！请前往 "+labelOf(myMachine,s.machines)+" 机台";
      $("my-ahead").textContent="0";
      showCallNotify(myNumber,myMachine,myIsMember,myAvatar,myName,myVip);
    }else if(idx>=0){
      var oldAhead=parseInt($("my-ahead").textContent,10);
      if(!isNaN(oldAhead)&&idx<oldAhead){
        $("my-ahead").classList.remove("flash-ahead");
        void $("my-ahead").offsetWidth;
        $("my-ahead").classList.add("flash-ahead");
      }
      $("my-ahead").textContent=idx;
      var hist=(s.waitHistory&&s.waitHistory[myMachine])||[];
      var avg=hist.length?Math.round(hist.slice(-10).reduce(function(a,b){return a+b},0)/Math.min(hist.length,10)*10)/10:5;
      $("my-est").textContent=Math.round(idx*avg*10)/10;
      $("my-status").className="status-line wait";
      $("my-status").textContent="排队中，前方还有 "+idx+" 位";
    }else{
      $("my-status").className="status-line wait";
      $("my-status").textContent="号码已过号或已叫，请咨询前台";
      $("my-ahead").textContent="—";
    }
  }
}
function connectSSE(){
  try{if(evtSource)evtSource.close()}catch(e){}
  evtSource=new EventSource("/api/events");
  evtSource.onmessage=function(e){var d={};try{d=JSON.parse(e.data)}catch(err){return}
    if(d.type==="sync")refreshFromState(d.state);
    else if(d.type==="call"&&d.machine===myMachine&&d.number===myNumber){
      $("my-status").className="status-line called";
      $("my-status").textContent="🎉 到号了！请前往 "+labelOf(myMachine,state.machines)+" 机台";
      $("my-ahead").textContent="0";
      // 用 call 消息里的 name/vip 更新通知
      var cName=d.name||myName,cVip=!!d.vip,cMember=!!d.member,cAvatar=d.avatar||myAvatar;
      showCallNotify(myNumber,myMachine,cMember,cAvatar,cName,cVip);
    }
  };
  evtSource.onerror=function(){try{evtSource.close()}catch(e){}setTimeout(connectSSE,5000)};
}
// 页面加载：检查是否有已保存的号码
function init(){
  fetch("/api/state").then(function(r){return r.json()}).then(function(s){
    if(s&&s.prices){
      state=s;
      if(s.shopName)$("shop-name").textContent=s.shopName;
      if(s.tagline)$("shop-tag").textContent=s.tagline;
      if(s.machines&&s.machines.length)renderMachinePick(s.machines);
      // 检查本地存储的号码
      var saved=loadNumber();
      if(saved&&saved.machine&&saved.number){
        myNumber=saved.number;myMachine=saved.machine;myIsMember=!!saved.isMember;myAvatar=saved.avatar||null;
        myName=saved.name||"";myVip=!!saved.vip;myVisits=saved.visits||0;
        if(saved.phone){
          $("in-phone").value=saved.phone;
          if(saved.isMember){
            $("member-tag").style.display="inline-block";
            $("member-info-row").classList.add("show");
            $("avatar-row").classList.add("show");
            if(myVip){$("visits-line").className="visits-line vip";$("visits-line").textContent="⭐⭐⭐ VIP 尊享 · 累计 "+myVisits+" 次 ⭐⭐⭐"}
            else{$("visits-line").className="visits-line";$("visits-line").textContent="您是第 "+myVisits+" 次光临"}
            $("in-member-name").value=myName;
            if(myAvatar){$("av-preview").style.backgroundImage="url('"+myAvatar+"')";$("av-tip").textContent="头像已设置，叫号时显示"}
          }
        }
        var q=s.queues[myMachine]||[];
        var idx=q.indexOf(myNumber);
        var called=s.current[myMachine]===myNumber;
        var ahead=idx>=0?idx:0;
        var hist=(s.waitHistory&&s.waitHistory[myMachine])||[];
        var avg=hist.length?Math.round(hist.slice(-10).reduce(function(a,b){return a+b},0)/Math.min(hist.length,10)*10)/10:5;
        var est=idx>=0?Math.round(idx*avg*10)/10:0;
        showResult(myMachine,myNumber,ahead,est,myIsMember,myName,myVip);
        if(called){
          $("my-status").className="status-line called";
          $("my-status").textContent="🎉 到号了！请前往 "+labelOf(myMachine,s.machines)+" 机台";
          $("my-ahead").textContent="0";
        }else if(idx>=0){
          $("my-status").className="status-line wait";
          $("my-status").textContent="排队中，前方还有 "+idx+" 位";
        }else{
          $("my-status").className="status-line wait";
          $("my-status").textContent="号码已过号或已叫，请咨询前台";
        }
        connectSSE();
      }
    }
  }).catch(function(){});
}
init();
})();
</script>
