<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音游窝社区</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Zpix';src:url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font/dist/Zpix.ttf') format('truetype');font-display:swap}
:root{
  --bg:#1a0f2e; --bg-panel:#2a1b4a; --bg-deep:#120a24; --bg-input:#1f1338;
  --text:#fff8e7; --text-mute:#a89bc9; --text-dim:#6b5d8f;
  --accent:#ff006e; --accent-2:#fb5607;
  --maimai:#00f5ff; --chunithm:#ff006e; --vip:#ffbe0b; --green:#06ffa5; --danger:#ff3864;
  --pixel-border:#000;
  --font-pixel:"Press Start 2P",monospace;
  --font-vt:"VT323",monospace;
  --font-pixel-cn:"Zpix","Press Start 2P",monospace;
  /* legacy aliases referenced by untouched script inline-styles */
  --text-muted:var(--text-mute);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-font-smoothing:none;font-family:var(--font-vt)}
body{padding-bottom:76px;position:relative;overflow-x:hidden}
/* 像素网格背景 */
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,0,110,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.06) 1px,transparent 1px);background-size:16px 16px;pointer-events:none;z-index:1}
/* CRT 扫描线 */
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.18) 0,rgba(0,0,0,0.18) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:2;mix-blend-mode:multiply}
/* 让内容层在网格/扫描线之上 */
.topbar,.wrap,.bottom-nav,#post-modal,#login-modal,#img-preview{position:relative;z-index:3}

/* ===== 顶部栏 ===== */
header.topbar{position:sticky;top:0;z-index:30;background:var(--bg-deep);border-bottom:4px solid var(--accent);box-shadow:0 4px 0 var(--pixel-border)}
.topbar-inner{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
header.topbar .shop{font-size:13px;font-weight:800;color:var(--vip);flex:1;letter-spacing:0.05em;font-family:var(--font-pixel);text-shadow:2px 2px 0 var(--pixel-border)}
header.topbar .icon-btn{background:var(--bg-panel);color:var(--text);width:38px;height:38px;border:3px solid var(--pixel-border);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.05s steps(2,end);box-shadow:3px 3px 0 var(--pixel-border)}
header.topbar .icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pixel-border)}

.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ===== 公告 ===== */
.notice-wrap{margin-top:12px}
.notice{background:var(--bg-panel);border:3px solid var(--pixel-border);border-left:6px solid var(--vip);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;box-shadow:4px 4px 0 rgba(0,0,0,0.5)}
.notice .n-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.notice .n-content{flex:1;font-size:15px;line-height:1.55;color:var(--text);font-family:var(--font-vt)}
.notice .n-title{color:var(--vip);font-weight:700;margin-bottom:3px;font-size:11px;font-family:var(--font-pixel);text-transform:uppercase;letter-spacing:0.05em;text-shadow:1px 1px 0 var(--pixel-border)}

/* ===== 搜索条 ===== */
.search-bar{display:flex;gap:8px;margin-top:12px;align-items:center}
.search-bar input{flex:1;background:var(--bg-input);border:3px solid var(--pixel-border);color:var(--text);padding:11px 14px;font-size:16px;font-family:var(--font-vt);outline:none;transition:border-color 0.1s steps(2,end);box-shadow:inset 2px 2px 0 rgba(0,0,0,0.4)}
.search-bar input:focus{border-color:var(--maimai)}
.search-bar input::placeholder{color:var(--text-dim)}
.search-bar .s-btn{background:var(--accent);color:#fff;border:3px solid var(--pixel-border);padding:11px 16px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-pixel);box-shadow:3px 3px 0 var(--pixel-border);transition:transform 0.05s steps(2,end);letter-spacing:0.05em}
.search-bar .s-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pixel-border)}
.search-bar .s-clear{font-size:14px;color:var(--text-mute);background:none;border:none;cursor:pointer;padding:6px 8px;font-family:var(--font-vt)}

/* ===== 分类标签 ===== */
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;background:var(--bg-panel);border:3px solid var(--pixel-border);color:var(--text-mute);padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform 0.05s steps(2,end);font-family:var(--font-pixel-cn);box-shadow:2px 2px 0 var(--pixel-border)}
.cat:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pixel-border)}
.cat.active{background:var(--accent);color:#fff;border-color:var(--pixel-border);box-shadow:2px 2px 0 var(--vip),0 0 8px var(--accent)}

.section-title{font-size:11px;color:var(--maimai);margin:16px 0 10px;letter-spacing:0.06em;font-weight:700;display:flex;align-items:center;gap:6px;font-family:var(--font-pixel);text-transform:uppercase;text-shadow:1px 1px 0 var(--pixel-border)}
.section-title::before{content:"";width:6px;height:14px;background:var(--maimai);box-shadow:0 0 0 2px var(--pixel-border)}

/* ===== 帖子卡片 - 游戏道具卡片 ===== */
.post{background:var(--bg-panel);border:3px solid var(--pixel-border);padding:16px;margin-bottom:14px;transition:transform 0.05s steps(2,end);box-shadow:6px 6px 0 rgba(0,0,0,0.5),inset 0 0 0 1px var(--bg-deep);position:relative}
.post:active{transform:translate(2px,2px);box-shadow:4px 4px 0 rgba(0,0,0,0.5),inset 0 0 0 1px var(--bg-deep)}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-head .avatar{width:40px;height:40px;background:var(--bg-deep);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--vip);flex-shrink:0;border:3px solid var(--pixel-border);image-rendering:pixelated;font-family:var(--font-pixel);box-shadow:2px 2px 0 var(--pixel-border)}
.post-head .avatar.vip{border-color:var(--danger);box-shadow:2px 2px 0 var(--danger),0 0 8px var(--danger)}
.post-head .avatar.member{border-color:var(--vip);box-shadow:2px 2px 0 var(--vip)}
.post-head .uinfo{flex:1;min-width:0}
.post-head .uname{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--text);font-family:var(--font-pixel-cn)}
.post-head .uname .vip-tag{font-size:9px;background:var(--danger);color:#fff;padding:3px 6px;border:2px solid var(--pixel-border);font-weight:700;letter-spacing:0.05em;font-family:var(--font-pixel);box-shadow:1px 1px 0 var(--pixel-border)}
.post-head .uname .m-tag{font-size:9px;background:var(--vip);color:var(--bg-deep);padding:3px 6px;border:2px solid var(--pixel-border);font-weight:700;letter-spacing:0.05em;font-family:var(--font-pixel);box-shadow:1px 1px 0 var(--pixel-border)}
.post-head .time{font-size:14px;color:var(--text-dim);margin-left:auto;flex-shrink:0;font-family:var(--font-vt)}
.post-cat{font-size:9px;font-weight:700;padding:4px 10px;margin-bottom:10px;display:inline-block;border:2px solid var(--pixel-border);font-family:var(--font-pixel);box-shadow:1px 1px 0 var(--pixel-border);letter-spacing:0.03em}
.post-cat.pinky{color:#fff;background:var(--chunithm)}
.post-cat.talk{color:var(--bg-deep);background:var(--maimai)}
.post-cat.show{color:var(--bg-deep);background:var(--vip)}
.post-cat.help{color:#fff;background:var(--danger)}
.post-title{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.4;color:var(--text);letter-spacing:0.02em;font-family:var(--font-pixel-cn);text-shadow:1px 1px 0 var(--pixel-border)}
.post-content{font-size:16px;color:var(--text-mute);line-height:1.6;margin-bottom:12px;white-space:pre-wrap;word-break:break-word;font-family:var(--font-vt)}
.post-imgs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.post-imgs::-webkit-scrollbar{display:none}
.post-imgs .img{flex-shrink:0;width:140px;height:105px;background:var(--bg-input);background-size:cover;background-position:center;border:3px solid var(--pixel-border);cursor:pointer;image-rendering:pixelated;box-shadow:2px 2px 0 var(--pixel-border)}
.post-foot{display:flex;align-items:center;gap:18px;padding-top:12px;border-top:2px dashed var(--pixel-border);font-size:15px;color:var(--text-mute);font-family:var(--font-vt)}
.post-foot .f-item{display:flex;align-items:center;gap:5px;cursor:pointer;transition:color 0.1s steps(2,end);padding:3px 6px}
.post-foot .f-item:hover{color:var(--maimai)}
.post-foot .f-item.liked{color:var(--danger);animation:blink 1s steps(2,end) infinite}
.post-foot .f-item.del-btn{color:var(--text-dim);margin-left:auto}
.post-foot .f-item.del-btn:active{color:var(--danger)}

/* ===== 评论 ===== */
.comments{margin-top:12px;padding-top:12px;border-top:2px dashed var(--pixel-border)}
.comment{font-size:15px;color:var(--text);margin-bottom:8px;line-height:1.55;font-family:var(--font-vt)}
.comment .c-name{color:var(--maimai);font-weight:700;margin-right:7px;font-size:13px;font-family:var(--font-pixel);text-shadow:1px 1px 0 var(--pixel-border)}
.comments .c-toggle{display:inline-block;margin-top:6px;font-size:11px;color:var(--accent);cursor:pointer;font-weight:700;padding:4px 0;font-family:var(--font-pixel);text-shadow:1px 1px 0 var(--pixel-border)}
.comments .c-toggle:active{opacity:0.7}
.comment-input{display:flex;gap:8px;margin-top:10px}
.comment-input input{flex:1;background:var(--bg-input);border:3px solid var(--pixel-border);color:var(--text);padding:9px 12px;font-size:15px;font-family:var(--font-vt);outline:none;box-shadow:inset 2px 2px 0 rgba(0,0,0,0.4)}
.comment-input input:focus{border-color:var(--maimai)}
.comment-input button{background:var(--accent);color:#fff;border:3px solid var(--pixel-border);padding:9px 14px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font-pixel);box-shadow:2px 2px 0 var(--pixel-border);transition:transform 0.05s steps(2,end);letter-spacing:0.05em}
.comment-input button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pixel-border)}

/* ===== 底部导航 ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg-deep);border-top:4px solid var(--pixel-border);box-shadow:0 -4px 0 var(--accent)}
.bottom-nav-inner{display:flex;max-width:680px;margin:0 auto}
.bottom-nav .nav-item{flex:1;padding:11px 0 13px;text-align:center;cursor:pointer;color:var(--text-dim);font-size:9px;transition:color 0.1s steps(2,end);font-family:var(--font-pixel);letter-spacing:0.03em}
.bottom-nav .nav-item.active{color:var(--accent);text-shadow:1px 1px 0 var(--pixel-border)}
.bottom-nav .nav-item .n-icon{font-size:21px;margin-bottom:3px}
.bottom-nav .nav-item.post-btn .n-icon{background:var(--accent);color:#fff;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 3px;font-weight:800;border:3px solid var(--pixel-border);box-shadow:0 0 8px var(--accent);font-family:var(--font-pixel)}

/* ===== 发帖浮层 ===== */
#post-modal{position:fixed;inset:0;z-index:100;background:rgba(6,5,16,0.85);display:none;align-items:flex-end;justify-content:center}
#post-modal.show{display:flex}
#post-modal .sheet{background:var(--bg-panel);border:4px solid var(--pixel-border);border-bottom:none;padding:22px 20px 28px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;animation:sheetUp 0.28s steps(6,end);box-shadow:0 -6px 0 var(--accent)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 18px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;color:var(--vip);letter-spacing:0.05em;font-family:var(--font-pixel);text-shadow:2px 2px 0 var(--pixel-border)}
.sheet h3 .close{font-size:20px;color:var(--danger);cursor:pointer;background:none;border:none;line-height:1;font-family:var(--font-pixel)}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--maimai);margin-bottom:8px;font-weight:700;font-family:var(--font-pixel);text-shadow:1px 1px 0 var(--pixel-border);letter-spacing:0.03em}
.field input,.field textarea,.field select{width:100%;background:var(--bg-input);border:3px solid var(--pixel-border);color:var(--text);padding:12px 14px;font-size:16px;font-family:var(--font-vt);outline:none;transition:border-color 0.1s steps(2,end);box-shadow:inset 2px 2px 0 rgba(0,0,0,0.4)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--maimai)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-dim)}
.field textarea{resize:vertical;min-height:100px;line-height:1.6}
.cat-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat-pick .cp-item{text-align:center;padding:12px 4px;background:var(--bg-deep);border:3px solid var(--pixel-border);font-size:12px;cursor:pointer;color:var(--text-mute);transition:transform 0.05s steps(2,end);font-family:var(--font-pixel-cn);box-shadow:2px 2px 0 var(--pixel-border)}
.cat-pick .cp-item:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pixel-border)}
.cat-pick .cp-item.sel{border-color:var(--accent);background:var(--bg-input);color:var(--accent);box-shadow:0 0 8px var(--accent)}
.cat-pick .cp-item .cp-icon{font-size:20px;display:block;margin-bottom:4px}

/* ===== 图片上传 ===== */
.img-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-pick .ip-item{width:84px;height:84px;background-size:cover;background-position:center;border:3px solid var(--pixel-border);position:relative;flex-shrink:0;image-rendering:pixelated;box-shadow:2px 2px 0 var(--pixel-border)}
.img-pick .ip-item .ip-del{position:absolute;top:-8px;right:-8px;width:22px;height:22px;background:var(--danger);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--pixel-border);font-family:var(--font-pixel)}
.img-pick .ip-add{width:84px;height:84px;border:3px dashed var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;cursor:pointer;background:var(--bg-input);flex-shrink:0;transition:border-color 0.1s steps(2,end);font-family:var(--font-pixel)}
.img-pick .ip-add:active{border-color:var(--accent);color:var(--accent)}
.img-pick .ip-add .plus{font-size:26px;margin-bottom:2px}
.img-tip{font-size:13px;color:var(--text-dim);margin-top:8px;font-family:var(--font-vt)}
.btn-submit{width:100%;padding:14px;background:var(--accent);color:#fff;border:3px solid var(--pixel-border);font-size:12px;font-weight:800;font-family:var(--font-pixel);cursor:pointer;margin-top:10px;transition:transform 0.05s steps(2,end);box-shadow:4px 4px 0 var(--pixel-border);text-shadow:1px 1px 0 var(--pixel-border);letter-spacing:0.05em}
.btn-submit:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--pixel-border)}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;background:var(--text-dim)}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:48px 20px;color:var(--text-dim)}
.empty .e-icon{font-size:44px;margin-bottom:12px;opacity:0.7;animation:blink 1.6s steps(2,end) infinite}
.empty .e-text{font-size:15px;line-height:1.5;font-family:var(--font-vt)}
.loading{text-align:center;padding:28px;color:var(--maimai);font-size:14px;font-family:var(--font-pixel);animation:blink 1s steps(2,end) infinite}

/* ===== 登录浮层 ===== */
#login-modal{position:fixed;inset:0;z-index:200;background:rgba(6,5,16,0.93);display:flex;align-items:center;justify-content:center;padding:20px}
#login-modal.hide{display:none}
#login-modal .login-box{background:var(--bg-panel);border:4px solid var(--pixel-border);padding:32px 26px;width:100%;max-width:380px;box-shadow:8px 8px 0 var(--accent),0 0 16px var(--chunithm)}
#login-modal .lb-icon{text-align:center;font-size:44px;margin-bottom:10px;animation:blink 1.6s steps(2,end) infinite}
#login-modal .lb-title{text-align:center;font-size:16px;font-weight:800;margin-bottom:8px;color:var(--vip);letter-spacing:0.05em;font-family:var(--font-pixel);text-shadow:2px 2px 0 var(--pixel-border)}
#login-modal .lb-sub{text-align:center;font-size:15px;color:var(--text-mute);margin-bottom:24px;line-height:1.55;font-family:var(--font-vt)}
#login-modal .lb-field{margin-bottom:14px}
#login-modal .lb-field label{display:block;font-size:10px;color:var(--maimai);margin-bottom:7px;font-family:var(--font-pixel);text-transform:uppercase;letter-spacing:0.05em;text-shadow:1px 1px 0 var(--pixel-border)}
#login-modal .lb-field input{width:100%;background:var(--bg-input);border:3px solid var(--pixel-border);color:var(--text);padding:13px 14px;font-size:16px;font-family:var(--font-vt);outline:none;transition:border-color 0.1s steps(2,end);box-shadow:inset 2px 2px 0 rgba(0,0,0,0.4)}
#login-modal .lb-field input:focus{border-color:var(--maimai)}
#login-modal .lb-field input::placeholder{color:var(--text-dim)}
#login-modal .lb-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:3px solid var(--pixel-border);font-size:12px;font-weight:800;font-family:var(--font-pixel);cursor:pointer;margin-top:6px;transition:transform 0.05s steps(2,end);box-shadow:4px 4px 0 var(--pixel-border);text-shadow:1px 1px 0 var(--pixel-border);letter-spacing:0.05em}
#login-modal .lb-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--pixel-border)}
#login-modal .lb-btn:disabled{opacity:0.5;cursor:not-allowed;background:var(--text-dim)}
#login-modal .lb-tip{font-size:13px;color:var(--text-dim);text-align:center;margin-top:16px;line-height:1.55;font-family:var(--font-vt)}
#login-modal .lb-status{font-size:14px;color:var(--danger);text-align:center;margin-top:10px;min-height:14px;font-family:var(--font-vt);animation:blink 0.8s steps(2,end) infinite}

/* ===== 我的页面 ===== */
.my-header{background:var(--bg-panel);border:4px solid var(--pixel-border);padding:22px 18px;margin:14px 0;text-align:center;box-shadow:6px 6px 0 var(--vip),inset 0 0 0 1px var(--bg-deep)}
.my-header .my-avatar{width:72px;height:72px;background:var(--bg-deep);background-size:cover;background-position:center;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--vip);border:4px solid var(--pixel-border);image-rendering:pixelated;font-family:var(--font-pixel);box-shadow:3px 3px 0 var(--pixel-border)}
.my-header .my-avatar.vip{border-color:var(--danger);box-shadow:3px 3px 0 var(--danger),0 0 12px var(--danger)}
.my-header .my-avatar.member{border-color:var(--vip);box-shadow:3px 3px 0 var(--vip)}
.my-header .my-name{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--text);letter-spacing:0.05em;font-family:var(--font-pixel-cn);text-shadow:1px 1px 0 var(--pixel-border)}
.my-header .my-stats{font-size:14px;color:var(--maimai);margin-top:8px;font-family:var(--font-vt)}
.my-header .btn-logout{margin-top:14px;padding:9px 22px;background:var(--bg-deep);border:3px solid var(--danger);color:var(--text);font-size:10px;font-family:var(--font-pixel);cursor:pointer;transition:transform 0.05s steps(2,end);box-shadow:3px 3px 0 var(--pixel-border);letter-spacing:0.05em}
.my-header .btn-logout:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pixel-border);background:var(--danger)}
.my-tabs{display:flex;gap:10px;margin:14px 0 0}
.my-tabs .tab{flex:1;text-align:center;padding:10px;background:var(--bg-deep);border:3px solid var(--pixel-border);font-size:12px;color:var(--text-mute);cursor:pointer;font-weight:700;transition:transform 0.05s steps(2,end);font-family:var(--font-pixel-cn);box-shadow:2px 2px 0 var(--pixel-border)}
.my-tabs .tab:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pixel-border)}
.my-tabs .tab.active{background:var(--accent);color:#fff;box-shadow:0 0 8px var(--accent)}

/* ===== 图片预览 ===== */
#img-preview{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.94);display:none;align-items:center;justify-content:center;padding:20px}
#img-preview.show{display:flex}
#img-preview img{max-width:100%;max-height:100%;border:4px solid var(--pixel-border);box-shadow:0 0 0 4px var(--accent),0 0 24px var(--accent);image-rendering:pixelated}
#img-preview .pv-close{position:absolute;top:22px;right:22px;color:var(--danger);font-size:24px;cursor:pointer;background:var(--bg-panel);border:3px solid var(--pixel-border);line-height:1;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--font-pixel);box-shadow:3px 3px 0 var(--pixel-border)}

/* ===== 动画 ===== */
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.3}}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
</style>
</head>

<script>
// ===== 论坛主程序 =====
var FORUM_SESSION_KEY="pq_forum_session_v1";
var currentUser=null;
var currentView="home";
var currentCat="全部";
var currentKeyword="";
var myTab="posts";
var pendingImages=[]; // 待上传的图片 URL 列表
var allPostsCache=[];
var myPostsCache=[];
var likedPostsCache=[];
function apiPost(p,b){return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function apiGet(p){return fetch(p).then(function(r){return r.json()})}
function saveSession(s){try{localStorage.setItem(FORUM_SESSION_KEY,JSON.stringify(s))}catch(e){}}
function loadSession(){try{var s=localStorage.getItem(FORUM_SESSION_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function clearSession(){try{localStorage.removeItem(FORUM_SESSION_KEY)}catch(e){}}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function timeAgo(ts){
  if(!ts)return "";
  var diff=Math.floor((Date.now()-ts)/1000);
  if(diff<60)return "刚刚";
  if(diff<3600)return Math.floor(diff/60)+" 分钟前";
  if(diff<86400)return Math.floor(diff/3600)+" 小时前";
  if(diff<2592000)return Math.floor(diff/86400)+" 天前";
  var d=new Date(ts);
  return (d.getMonth()+1)+"-"+d.getDate();
}
// ===== 登录 =====
function doLogin(){
  var phone=String(document.getElementById('login-phone').value||'').trim();
  var name=String(document.getElementById('login-name').value||'').trim();
  var statusEl=document.getElementById('login-status');
  var btn=document.getElementById('lb-btn');
  if(!phone||phone.length<11){statusEl.textContent='请输入完整的 11 位手机号';return}
  if(!name){statusEl.textContent='请输入昵称';return}
  btn.disabled=true;btn.textContent='登录中…';statusEl.textContent='';
  apiPost('/api/check-member',{phone:phone}).then(function(d){
    btn.disabled=false;btn.textContent='进入社区';
    if(d&&d.isMember){
      currentUser={phone:phone,name:d.name||name,avatar:d.avatar||null,isMember:true,vip:!!d.vip,visits:d.visits||0};
    }else{
      currentUser={phone:phone,name:name,avatar:null,isMember:false,vip:false,visits:0};
    }
    saveSession(currentUser);
    enterForum();
  }).catch(function(e){
    btn.disabled=false;btn.textContent='进入社区';
    statusEl.textContent='网络错误：'+e.message;
  });
}
function enterForum(){
  if(!currentUser){document.getElementById('login-modal').classList.remove('hide');return}
  document.getElementById('login-modal').classList.add('hide');
  renderMyHeader();
  loadPosts();
  loadMyPosts();
}
function doLogout(){
  if(!confirm('确定退出登录？'))return;
  clearSession();
  currentUser=null;
  document.getElementById('login-modal').classList.remove('hide');
  document.getElementById('login-phone').value='';
  document.getElementById('login-name').value='';
  document.getElementById('login-status').textContent='';
}
// ===== 公告加载 =====
function loadAnnouncements(){
  apiGet('/api/announcements').then(function(d){
    if(!d||!d.ok)return;
    renderNotices(d.announcements||[]);
  }).catch(function(){});
}
function renderNotices(list){
  var wrap=document.getElementById('notice-wrap');
  if(!list||!list.length){wrap.innerHTML='';return}
  var html='';
  list.forEach(function(a){
    html+='<div class="notice">'+
      '<div class="n-icon">📢</div>'+
      '<div class="n-content"><div class="n-title">'+escapeHtml(a.title)+'</div>'+escapeHtml(a.content)+'</div>'+
      '</div>';
  });
  wrap.innerHTML=html;
}
// ===== 帖子列表 =====
function loadPosts(){
  var box=document.getElementById('post-list');
  box.innerHTML='<div class="loading">加载中…</div>';
  var url='/api/posts?';
  var params=[];
  if(currentCat&&currentCat!=='全部')params.push('cat='+encodeURIComponent(currentCat));
  if(currentKeyword)params.push('keyword='+encodeURIComponent(currentKeyword));
  apiGet(url+params.join('&')).then(function(d){
    if(!d||!d.ok){box.innerHTML='<div class="empty"><div class="e-icon">⚠️</div><div class="e-text">加载失败</div></div>';return}
    allPostsCache=d.posts||[];
    renderPostList(box,allPostsCache);
  }).catch(function(e){
    box.innerHTML='<div class="empty"><div class="e-icon">⚠️</div><div class="e-text">网络错误</div></div>';
  });
}
function renderPostList(box,posts){
  if(!posts||!posts.length){
    var msg=currentKeyword?('没有匹配「'+escapeHtml(currentKeyword)+'」的帖子'):'还没有帖子，快来发第一条吧';
    box.innerHTML='<div class="empty"><div class="e-icon">📝</div><div class="e-text">'+msg+'</div></div>';
    return;
  }
  var html='';
  posts.forEach(function(p){html+=renderPostCard(p,false)});
  box.innerHTML=html;
  bindPostEvents(box);
}
function renderPostCard(p,isMy){
  var catCls={pinky:'pinky',talk:'talk',show:'show',help:'help'}[p.cat]||'talk';
  var catName=p.cat||'讨论';
  var initial=p.authorName?p.authorName.charAt(0).toUpperCase():'?';
  var avStyle=p.authorAvatar?('background-image:url(\''+p.authorAvatar+'\')'):'';
  var avCls='avatar '+(p.authorVip?'vip':(p.authorMember?'member':''));
  var nameTag='';
  if(p.authorVip)nameTag='<span class="vip-tag">VIP</span>';
  else if(p.authorMember)nameTag='<span class="m-tag">会员</span>';
  var liked=currentUser&&Array.isArray(p.likedBy)&&p.likedBy.indexOf(currentUser.phone)>=0;
  var imgsHtml='';
  if(p.images&&p.images.length){
    imgsHtml='<div class="post-imgs">';
    p.images.forEach(function(u){imgsHtml+='<div class="img" data-img="'+escapeHtml(u)+'" style="background-image:url(\''+escapeHtml(u)+'\')"></div>'});
    imgsHtml+='</div>';
  }
  var delBtn=isMy?'<span class="f-item del-btn" data-del="'+p.id+'">🗑️ 删除</span>':'';
  // 评论（默认只显示最后3条，多余的折叠，点击展开全部）
  var commentsHtml='';
  if(p.comments&&p.comments.length){
    var cAll=p.comments;
    var cTotal=cAll.length;
    var cShow=3;
    var cHideFrom=cTotal>cShow?cTotal-cShow:0;
    commentsHtml='<div class="comments">';
    cAll.forEach(function(c,idx){
      var isExtra=idx<cHideFrom;
      commentsHtml+='<div class="comment'+(isExtra?' c-extra':'')+'"'+(isExtra?' style="display:none"':'')+'><span class="c-name">'+escapeHtml(c.name||'匿名')+':</span>'+escapeHtml(c.text)+'</div>';
    });
    if(cTotal>cShow){
      commentsHtml+='<span class="c-toggle" data-ctoggle="'+p.id+'">查看全部 '+cTotal+' 条评论</span>';
    }
    commentsHtml+='</div>';
  }
  var commentInput=currentUser?('<div class="comment-input"><input type="text" placeholder="说点什么…" data-cinp="'+p.id+'"><button type="button" data-cbtn="'+p.id+'">发送</button></div>'):'';
  return '<div class="post" data-pid="'+p.id+'">'+
    '<div class="post-head">'+
      '<div class="'+avCls+'" style="'+avStyle+'">'+(p.authorAvatar?'':escapeHtml(initial))+'</div>'+
      '<div class="uinfo">'+
        '<div class="uname">'+escapeHtml(p.authorName||'匿名')+' '+nameTag+'</div>'+
      '</div>'+
      '<span class="time">'+timeAgo(p.createdAt)+'</span>'+
    '</div>'+
    '<span class="post-cat '+catCls+'">'+escapeHtml(catName)+'</span>'+
    (p.title?('<div class="post-title">'+escapeHtml(p.title)+'</div>'):'')+
    (p.content?('<div class="post-content">'+escapeHtml(p.content)+'</div>'):'')+
    imgsHtml+
    '<div class="post-foot">'+
      '<span class="f-item '+(liked?'liked':'')+'" data-like="'+p.id+'">❤️ '+(p.likes||0)+'</span>'+
      '<span class="f-item">💬 '+(p.comments?p.comments.length:0)+'</span>'+
      '<span class="f-item">👁️ '+(p.views||0)+'</span>'+
      delBtn+
    '</div>'+
    commentsHtml+commentInput+
  '</div>';
}
function bindPostEvents(box){
  // 点赞
  box.querySelectorAll('[data-like]').forEach(function(el){
    el.addEventListener('click',function(){
      if(!currentUser){alert('请先登录');return}
      var pid=el.dataset.like;
      apiPost('/api/posts/like',{id:pid,phone:currentUser.phone}).then(function(){
        loadPosts();loadMyPosts();
      }).catch(function(){});
    });
  });
  // 删除（我的）
  box.querySelectorAll('[data-del]').forEach(function(el){
    el.addEventListener('click',function(){
      var pid=el.dataset.del;
      if(!confirm('确定删除这条帖子吗？'))return;
      manualDeletedIds.add(pid);
      apiPost('/api/posts/delete',{id:pid,byPhone:currentUser?currentUser.phone:''}).then(function(d){
        if(d&&d.ok){loadPosts();loadMyPosts();}
        else{manualDeletedIds.delete(pid);alert((d&&d.error)||'删除失败')}
      }).catch(function(){manualDeletedIds.delete(pid);alert('网络错误')});
    });
  });
  // 图片预览
  box.querySelectorAll('[data-img]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      openImgPreview(el.dataset.img);
    });
  });
  // 评论发送
  box.querySelectorAll('[data-cbtn]').forEach(function(btn){
    btn.addEventListener('click',function(e){e.preventDefault();
      var pid=btn.dataset.cbtn;
      var inp=box.querySelector('[data-cinp="'+pid+'"]');
      if(!inp)return;
      var txt=String(inp.value||'').trim();
      if(!txt)return;
      apiPost('/api/posts/comment',{id:pid,phone:currentUser.phone,name:currentUser.name,text:txt}).then(function(d){
        if(d&&d.ok){inp.value='';loadPosts();loadMyPosts();}
        else{alert((d&&d.error)||'评论失败')}
      }).catch(function(){alert('网络错误')});
    });
  });
  // 评论展开/收起
  box.querySelectorAll('[data-ctoggle]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var pid=el.dataset.ctoggle;
      var card=box.querySelector('.post[data-pid="'+pid+'"]');
      if(!card)return;
      var extras=card.querySelectorAll('.comment.c-extra');
      var isHidden=extras.length&&extras[0].style.display==='none';
      extras.forEach(function(x){x.style.display=isHidden?'':'none'});
      var total=card.querySelectorAll('.comment').length;
      el.textContent=isHidden?'收起':('查看全部 '+total+' 条评论');
    });
  });
  // 浏览量 +1
  box.querySelectorAll('.post[data-pid]').forEach(function(card){
    var once={done:false};
    card.addEventListener('click',function(){
      if(once.done)return;once.done=true;
      apiPost('/api/posts/view',{id:card.dataset.pid}).catch(function(){});
    });
  });
}
// ===== 我的页面 =====
function loadMyPosts(){
  if(!currentUser){return}
  var box=document.getElementById('my-post-list');
  if(myTab==='posts'){
    box.innerHTML='<div class="loading">加载中…</div>';
    apiGet('/api/posts?authorPhone='+encodeURIComponent(currentUser.phone)).then(function(d){
      if(!d||!d.ok){box.innerHTML='<div class="empty"><div class="e-text">加载失败</div></div>';return}
      myPostsCache=d.posts||[];
      if(!myPostsCache.length){
        box.innerHTML='<div class="empty"><div class="e-icon">📭</div><div class="e-text">还没有发过帖子，去发一条吧</div></div>';
        return;
      }
      box.innerHTML=myPostsCache.map(function(p){return renderPostCard(p,true)}).join('');
      bindPostEvents(box);
    }).catch(function(){box.innerHTML='<div class="empty"><div class="e-text">网络错误</div></div>'});
  }else{
    // 点赞过的帖子：从全部缓存筛
    var liked=allPostsCache.filter(function(p){return currentUser&&Array.isArray(p.likedBy)&&p.likedBy.indexOf(currentUser.phone)>=0});
    likedPostsCache=liked;
    if(!liked.length){
      box.innerHTML='<div class="empty"><div class="e-icon">❤️</div><div class="e-text">还没有点赞过任何帖子</div></div>';
      return;
    }
    box.innerHTML=liked.map(function(p){return renderPostCard(p,false)}).join('');
    bindPostEvents(box);
  }
}
function renderMyHeader(){
  if(!currentUser)return;
  var avEl=document.getElementById('my-avatar');
  var nameEl=document.getElementById('my-name');
  var statsEl=document.getElementById('my-stats');
  var initial=currentUser.name?currentUser.name.charAt(0).toUpperCase():'?';
  if(currentUser.avatar){
    avEl.style.backgroundImage="url('"+currentUser.avatar+"')";
    avEl.textContent='';
  }else{
    avEl.style.backgroundImage='none';
    avEl.textContent=initial;
  }
  avEl.className='my-avatar '+(currentUser.vip?'vip':(currentUser.isMember?'member':''));
  var tagHtml='';
  if(currentUser.vip)tagHtml='<span class="vip-tag">VIP</span>';
  else if(currentUser.isMember)tagHtml='<span class="m-tag">会员</span>';
  else tagHtml='<span class="tag-g" style="font-size:10px;background:var(--bg-deep);color:var(--text-muted);padding:2px 7px;border-radius:9px;font-weight:600">游客</span>';
  nameEl.innerHTML=escapeHtml(currentUser.name)+' '+tagHtml;
  var stats=[];
  if(currentUser.isMember)stats.push('累计出勤 '+currentUser.visits+' 次');
  stats.push('已发帖 '+(myPostsCache?myPostsCache.length:0)+' 条');
  statsEl.textContent=stats.join(' · ');
}
// ===== 发帖 =====
function openPost(){
  if(!currentUser){alert('请先登录');return}
  // 重置表单
  document.getElementById('post-title').value='';
  document.getElementById('post-content').value='';
  pendingImages=[];
  renderImgPick();
  document.getElementById('post-modal').classList.add('show');
}
function closePost(){document.getElementById('post-modal').classList.remove('show')}
function renderImgPick(){
  var box=document.getElementById('img-pick');
  var addBtn=document.getElementById('ip-add-btn');
  // 清空除了 addBtn 外的所有
  var items=box.querySelectorAll('.ip-item');
  items.forEach(function(it){it.remove()});
  pendingImages.forEach(function(url,idx){
    var d=document.createElement('div');
    d.className='ip-item';
    d.style.backgroundImage="url('"+url+"')";
    d.innerHTML='<div class="ip-del" data-imgdel="'+idx+'">×</div>';
    box.insertBefore(d,addBtn);
  });
  // 绑定删除
  box.querySelectorAll('[data-imgdel]').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var i=parseInt(el.dataset.imgdel,10);
      pendingImages.splice(i,1);
      renderImgPick();
    });
  });
  // 超过 6 张隐藏 add
  addBtn.style.display=pendingImages.length>=6?'none':'flex';
}
function uploadPostImage(file){
  if(!file)return;
  var tip=document.getElementById('img-tip');
  if(file.size>5*1024*1024){tip.textContent='图片过大（超过 5MB）';return}
  tip.textContent='上传中…';
  var fd=new FormData();fd.append('file',file);
  fetch('/api/upload-post-image',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(d){
    if(d&&d.ok){
      pendingImages.push(d.url);
      renderImgPick();
      tip.textContent='已添加，可继续上传（最多 6 张）';
    }else{
      tip.textContent='上传失败：'+((d&&d.error)||'未知错误');
    }
  }).catch(function(e){tip.textContent='上传失败：'+e.message});
}
function submitPost(){
  if(!currentUser){alert('请先登录');return}
  var title=String(document.getElementById('post-title').value||'').trim();
  var content=String(document.getElementById('post-content').value||'').trim();
  if(!title&&!content){alert('标题或内容不能为空');return}
  var catEl=document.querySelector('.cp-item.sel');
  var cat=catEl?catEl.dataset.cat:'讨论';
  var btn=document.getElementById('btn-submit-post');
  btn.disabled=true;btn.textContent='发布中…';
  apiPost('/api/posts',{
    title:title,
    content:content,
    cat:cat,
    authorPhone:currentUser.phone,
    authorName:currentUser.name,
    authorVip:!!currentUser.vip,
    authorMember:!!currentUser.isMember,
    authorAvatar:currentUser.avatar||null,
    images:pendingImages.slice()
  }).then(function(d){
    btn.disabled=false;btn.textContent='发布';
    if(d&&d.ok){
      closePost();
      // 切回首页并刷新
      switchView('home');
      loadPosts();
      loadMyPosts();
    }else{
      alert((d&&d.error)||'发布失败');
    }
  }).catch(function(e){
    btn.disabled=false;btn.textContent='发布';
    alert('网络错误：'+e.message);
  });
}
// ===== 图片预览 =====
function openImgPreview(url){
  document.getElementById('img-preview-src').src=url;
  document.getElementById('img-preview').classList.add('show');
}
function closeImgPreview(){
  document.getElementById('img-preview').classList.remove('show');
  document.getElementById('img-preview-src').src='';
}
// ===== 视图切换 =====
function switchView(v){
  currentView=v;
  document.querySelectorAll('.nav-item[data-nav]').forEach(function(el){
    el.classList.toggle('active',el.dataset.nav===v);
  });
  document.getElementById('view-home').style.display=v==='home'?'block':'none';
  document.getElementById('view-my').style.display=v==='my'?'block':'none';
  // 搜索条只在首页显示
  document.getElementById('search-bar').style.display=(v==='home')?'flex':'none';
  if(v==='my'){
    renderMyHeader();
    loadMyPosts();
  }else if(v==='home'){
    loadPosts();
  }
}
// ===== 初始化 =====
function initForum(){
  var sess=loadSession();
  if(sess&&sess.phone){
    apiPost('/api/check-member',{phone:sess.phone}).then(function(d){
      if(d&&d.isMember){
        currentUser={phone:sess.phone,name:d.name||sess.name,avatar:d.avatar||sess.avatar,isMember:true,vip:!!d.vip,visits:d.visits||0};
      }else{
        currentUser=sess;
      }
      saveSession(currentUser);
      enterForum();
    }).catch(function(){
      currentUser=sess;
      enterForum();
    });
  }else{
    try{
      var taken=localStorage.getItem('pq_taken_number_v1');
      if(taken){
        var t=JSON.parse(taken);
        if(t&&t.phone){
          document.getElementById('login-phone').value=t.phone;
          if(t.name)document.getElementById('login-name').value=t.name;
        }
      }
    }catch(e){}
  }
  // 获取店名
  fetch('/api/state').then(function(r){return r.json()}).then(function(s){
    if(s&&s.shopName)document.getElementById('shop-name').textContent=s.shopName+' · 社区';
  }).catch(function(){});
  // 公告
  loadAnnouncements();
  // SSE 实时监听（AI 审核撤回等）
  initSSE();
}
// ===== SSE 实时监听 =====
var forumSSE=null;
var lastPostIds=[];
var manualDeletedIds=new Set();
function initSSE(){
  try{
    forumSSE=new EventSource('/api/events');
    forumSSE.onmessage=function(ev){
      try{
        var msg=JSON.parse(ev.data);
        if(msg.type==='sync'){
          // 检测帖子被撤回（之前有、现在没了）
          if(lastPostIds&&lastPostIds.length){
            var nowIds=(msg.state&&msg.state.posts||[]).map(function(p){return p.id});
            var removed=lastPostIds.filter(function(id){return nowIds.indexOf(id)<0});
            if(removed.length){
              removed.forEach(function(rid){
                // 跳过用户手动删除的帖子，避免误报"违规撤回"
                if(manualDeletedIds.has(rid)){manualDeletedIds.delete(rid);return;}
                showToast('你的帖子因内容违规已被系统撤回');
              });
              // 刷新当前列表
              if(currentView==='home')loadPosts();
              if(currentView==='my')loadMyPosts();
            }
          }
          // 记录当前用户最新帖子ID（用于撤回检测）
          if(currentUser){
            lastPostIds=(msg.state&&msg.state.posts||[]).filter(function(p){return p.authorPhone===currentUser.phone}).map(function(p){return p.id}).slice(0,5);
          }
        }
      }catch(e){}
    };
  }catch(e){}
}
// Toast 提示
function showToast(text){
  var t=document.createElement('div');
  t.textContent=text;
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,92,122,0.95);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:500;box-shadow:0 6px 24px rgba(255,92,122,0.4);animation:toastIn 0.3s ease;max-width:90vw;text-align:center';
  document.body.appendChild(t);
  setTimeout(function(){t.style.transition='opacity 0.4s';t.style.opacity='0';setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},400)},3500);
}
// ===== 事件绑定 =====
// 分类
document.getElementById('cats').addEventListener('click',function(e){
  var el=e.target.closest('.cat');if(!el)return;
  document.querySelectorAll('#cats .cat').forEach(function(c){c.classList.remove('active')});
  el.classList.add('active');

  document.getElementById('list-title').textContent=currentCat==='全部'?'最新':currentCat;
  loadPosts();
});
// 搜索
document.getElementById('btn-search').addEventListener('click',function(){
  var bar=document.getElementById('search-bar');
  bar.style.display=bar.style.display==='none'?'flex':'none';
  if(bar.style.display==='none'){
    currentKeyword='';loadPosts();
  }else{
    document.getElementById('search-input').focus();
  }
});
document.getElementById('s-btn-go').addEventListener('click',function(){
  currentKeyword=String(document.getElementById('search-input').value||'').trim();
  loadPosts();
});
document.getElementById('search-input').addEventListener('keydown',function(e){
  if(e.key==='Enter'){currentKeyword=String(this.value||'').trim();loadPosts()}
});

  currentKeyword='';
  loadPosts();
});
// 发帖入口
document.getElementById('btn-post-top').addEventListener('click',openPost);
document.getElementById('nav-post').addEventListener('click',openPost);
document.getElementById('btn-submit-post').addEventListener('click',function(e){e.preventDefault();submitPost()});
// 发帖分类选择
document.getElementById('cat-pick').addEventListener('click',function(e){
  var el=e.target.closest('.cp-item');if(!el)return;
  document.querySelectorAll('#cat-pick .cp-item').forEach(function(c){c.classList.remove('sel')});
  el.classList.add('sel');
});
// 图片选择
document.getElementById('ip-add-btn').addEventListener('click',function(){
  document.getElementById('ip-file-input').click();
});
document.getElementById('ip-file-input').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  if(f){uploadPostImage(f);e.target.value=''}
});
// 浮层关闭
document.getElementById('post-modal').addEventListener('click',function(e){
  if(e.target===this)closePost();
});
document.getElementById('img-preview').addEventListener('click',function(e){
  if(e.target===this)closeImgPreview();
});
// 底部导航
document.querySelectorAll('.nav-item[data-nav]').forEach(function(el){
  el.addEventListener('click',function(){switchView(el.dataset.nav)});
});
// 我的 tab
document.querySelectorAll('.my-tabs .tab').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.my-tabs .tab').forEach(function(t){t.classList.remove('active')});
    el.classList.add('active');
    myTab=el.dataset.myt;
    loadMyPosts();
  });

// 回车登录
document.getElementById('login-phone').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('login-name').focus()});
document.getElementById('login-name').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
// 启动
initForum();
</script>
